<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img"><title>Макет сигнала: блоки с несколькими группами интерфейсов</title><desc>Фрагмент схемы Бармицвы: Blackmagic раздаёт генлок сверху, D3 отдаёт 4 HDMI в Q8 прямыми линиями, Q8 показывает карты входа и выхода отсеками со свёрнутыми свободными группами, два MCTRL4K стоят столбиком с генлок-петлёй сверху вниз, сеть от D3 и Q8 уходит вниз на свитч отдельным цветом.</desc><defs><marker id="arrow-7F77DD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-888780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-E24B4A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>.th{font-family:'Segoe UI', system-ui, -apple-system, sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:'Segoe UI', system-ui, -apple-system, sans-serif;font-size:12px;fill:#5F5E5A}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5px}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5px}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5px}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5px}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5px}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#