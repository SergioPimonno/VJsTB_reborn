<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img"><title>Макет питания: многогрупповые щиты</title><desc>Фрагмент силовой схемы Бармицвы: фишка 125A питает AlpenBox, у AlpenBox вход слева, справа группы 4 по CEE 32A развёрнуты по гнёздам, остальные группы свёрнуты. Два гнезда 32A идут на две проходные, у проходных транзитный выход снизу, отходящие 6 по 16A пучками уходят на экран L1.</desc><defs><marker id="arrow-D4537E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D4537E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-E24B4A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-888780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>.th{font-family:'Segoe UI', system-ui, -apple-system, sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-family:'Segoe UI', system-ui, -apple-system, sans-serif;font-size:12px;fill:#5F5E5A}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5px}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5px}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5px}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5px}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5px}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}</style><rect width="100%" height="100%" fill="#FFFFFF"/>
