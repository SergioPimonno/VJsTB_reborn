<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Планер пультовой: автономный интерактивный прототип (один файл, без сборки).
     Открывается двойным щелчком в браузере. Данные оборудования УСЛОВНЫЕ, состояние хранится в localStorage
     (ключ planner-proto-v1), кнопка «Сбросить пример» возвращает исходный пример.
     Шрифты подтягиваются с Google Fonts, без сети работают запасные системные.
     Это референс поведения для внедрения в приложение: см. PLAN.md рядом. -->
<style>/* автономная страница: то, что в Artifact давал внешний каркас */
html{color-scheme:light}html,body{margin:0}[hidden]{display:none!important}</style>
<title>Планер пультовой</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Раскладка: полоса итогов → библиотека | рабочая зона (башни / план) | сводка.
   Стойки нарисованы как в кофрах: тёмный корпус, серебристые лицевые панели с «ушами». */
:root{
  --bg:#E6EAED; --panel:#F4F6F7; --panel2:#FFFFFF; --ink:#16202A; --muted:#586873; --line:#C6CFD5;
  --accent:#3447D1; --accent-soft:#DDE2FA;
  --warn:#8F5400; --warn-bg:#FFEFD0; --err:#B5301F; --err-bg:#FBE0DC; --ok:#1B7F4F;
  --case:#262D33; --case-ink:#C9D2D8; --rail:#8D99A2; --slot:#0E1215; --slotline:#2A333A;
  --face:#D3D9DD; --face-ink:#141B20; --hole:#4E5A63;
  --k-video:#3A7BD5; --k-net:#2E9E5B; --k-pwr:#D13B3B; --k-misc:#8A6FCF;
  --c-optic:#D9A400; --c-sdi:#E8710A; --c-net:#2E9E5B; --c-pwr:#D13B3B;
  --floor:#F3F5F6; --grid:#D2D9DE; --furn:#CBD3D8; --stage:#2A3139; --stage-ink:#D7DEE3;
  --f-disp:"Oswald","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --uh:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161A; --panel:#182027; --panel2:#1F2830; --ink:#E4EBEF; --muted:#8B9CA7; --line:#2F3B45;
  --accent:#93A2FF; --accent-soft:#242E63;
  --warn:#F2B24C; --warn-bg:#3A2D12; --err:#FF9382; --err-bg:#3E1D19; --ok:#54C58C;
  --case:#0C1013; --case-ink:#A9B5BD; --rail:#55626C; --slot:#07090B; --slotline:#222B32;
  --face:#98A3AA; --face-ink:#0D1317; --hole:#39444C;
  --floor:#151B20; --grid:#25303A; --furn:#2B3740; --stage:#0A0D10;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161A; --panel:#182027; --panel2:#1F2830; --ink:#E4EBEF; --muted:#8B9CA7; --line:#2F3B45;
  --accent:#93A2FF; --accent-soft:#242E63;
  --warn:#F2B24C; --warn-bg:#3A2D12; --err:#FF9382; --err-bg:#3E1D19; --ok:#54C58C;
  --case:#0C1013; --case-ink:#A9B5BD; --rail:#55626C; --slot:#07090B; --slotline:#222B32;
  --face:#98A3AA; --face-ink:#0D1317; --hole:#39444C;
  --floor:#151B20; --grid:#25303A; --furn:#2B3740; --stage:#0A0D10;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--f-mono)}
.app{max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* шапка */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
h1{font-family:var(--f-disp);font-weight:600;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.proj{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0b1020}}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1020}}
.btn.sm{padding:3px 9px;font-size:12.5px}

/* итоги */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:0}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat .v{font-family:var(--f-disp);font-weight:500;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.stat.warn .v{color:var(--warn)} .stat.err .v{color:var(--err)}

/* колонки */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:12px;align-items:start}
.lib,.side,.work{min-width:0}
.lib{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.lib.over-trash{outline:2px dashed var(--err);background:var(--err-bg)}
.lib-head{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lib-head input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:2px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.lib-trash{display:none;padding:10px;color:var(--err);font-weight:600;text-align:center}
.lib.over-trash .lib-trash{display:block}
.cat{font-family:var(--f-disp);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);padding:10px 12px 4px}
.card{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 12px;border-left:3px solid var(--kc,var(--line));margin:1px 0;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.card:hover{background:var(--panel2)}
.glyph{flex:0 0 38px;height:30px;display:flex;align-items:center;justify-content:center}
.glyph i{display:block;background:var(--face);border:1px solid var(--hole);border-radius:2px}
.glyph .g-case{border:2px solid var(--muted);background:transparent;border-radius:3px}
.glyph .g-furn{background:var(--furn);border-color:var(--muted)}
.glyph .g-loose{background:var(--ink);opacity:.8;border:0}
.ci{flex:1;min-width:0}
.cn{font-weight:500;font-size:13px;line-height:1.25}
.cd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .add{border:1px solid var(--line);background:var(--panel2);border-radius:5px;width:26px;height:26px;line-height:1;font-size:16px;flex:0 0 auto}
.card .add:hover{border-color:var(--accent);color:var(--accent)}
.lib-foot{padding:10px;border-top:1px solid var(--line)}

/* единицы измерения */
.m-u .cm-part,.m-u .sep{display:none}
.m-cm .u-part,.m-cm .sep{display:none}
.m-u .cm-only,.m-cm .u-only{display:none}

/* рабочая зона */
.work{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 16px;font-family:var(--f-disp);font-weight:500;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.towers-scroll{display:flex;gap:26px;overflow-x:auto;padding:4px 4px 14px;align-items:flex-start}
.tower{flex:0 0 auto;width:268px}
.t-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tag{font-family:var(--f-disp);font-weight:600;font-size:20px;background:var(--ink);color:var(--bg);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;flex:0 0 auto}
.t-name{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-weight:600;padding:4px 6px;border-radius:4px}
.t-name:hover,.t-name:focus{border-color:var(--line);background:var(--panel2)}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;width:26px;height:26px;border-radius:4px}
.x:hover{background:var(--err-bg);color:var(--err)}
.tower.on .tag{background:var(--accent);color:#fff}
.t-body{display:flex;gap:8px}
.bracket{flex:0 0 22px;display:flex;flex-direction:column;align-items:center;padding:4px 0}
.bracket::before,.bracket::after{content:"";flex:1;width:1px;background:var(--muted)}
.bracket span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:6px 0;white-space:nowrap}
.stack{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.addcase{width:100%;padding:5px 8px;border:1px dashed var(--muted);background:transparent;border-radius:6px;color:var(--muted);margin-bottom:3px}
.case{background:var(--case);border-radius:7px;padding:5px 8px 8px;color:var(--case-ink);border:1px solid #000}
.c-head{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-weight:500;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 0 5px}
.c-head .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-head .mono{font-size:10.5px;letter-spacing:0;text-transform:none;opacity:.85}
.c-head .x{color:var(--case-ink);width:20px;height:20px;font-size:16px}
.rack{display:grid;grid-template-columns:20px 1fr 24px;height:calc(var(--uh) * var(--u))}
.ruler{display:flex;flex-direction:column;font-family:var(--f-mono);font-size:10px;color:var(--case-ink);opacity:.8}
.ruler i{font-style:normal;height:var(--uh);display:flex;align-items:center}
.ruler.l i{justify-content:flex-start}
.ruler.r i{justify-content:flex-end;font-size:9.5px}
.slots{position:relative;background-color:var(--slot);background-image:linear-gradient(to bottom,var(--slotline) 1px,transparent 1px);background-size:100% var(--uh);border-left:6px solid var(--rail);border-right:6px solid var(--rail);border-radius:2px}
.ritem{position:absolute;left:0;right:0;padding:0 14px;color:var(--face-ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:
   radial-gradient(circle at 6px 50%,var(--hole) 0 2.2px,transparent 2.8px),
   radial-gradient(circle at calc(100% - 6px) 50%,var(--hole) 0 2.2px,transparent 2.8px),
   linear-gradient(to bottom,rgba(255,255,255,.28),rgba(0,0,0,.06)),var(--face);
  box-shadow:inset 0 -3px 0 var(--k,var(--k-misc)),0 0 0 1px rgba(0,0,0,.5);border-radius:2px;
  display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.ritem.u1{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;padding-bottom:3px}
.ritem .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ritem .dm{font-family:var(--f-mono);font-size:10px;opacity:.85;white-space:nowrap}
.ritem.on{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.ritem.lifted{opacity:.35}
.ritem.bad{box-shadow:inset 0 -3px 0 var(--err),0 0 0 2px var(--err)}
.warnmark{position:absolute;right:14px;top:2px;background:var(--err);color:#fff;border-radius:50%;width:15px;height:15px;font-size:11px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.slot-prev{position:absolute;left:0;right:0;border:2px dashed var(--ok);background:rgba(46,158,91,.28);pointer-events:none;z-index:3}
.slot-prev.no{border-color:var(--err);background:rgba(209,59,59,.3)}
.t-foot{margin-top:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.new-tower{flex:0 0 190px;min-height:200px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:13px}
.new-tower.hot{border-color:var(--ok);color:var(--ok);background:rgba(46,158,91,.08)}
.boxcard{flex:0 0 250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.boxcard h3{font-family:var(--f-disp);font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:0}
.boxcard.hot{border-color:var(--ok);background:rgba(46,158,91,.08)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.hi i{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:1px 9px;font-size:12px;margin:0 4px 4px 0;cursor:pointer}
.pill.on{border-color:var(--accent);background:var(--accent-soft)}

/* план */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend b{display:inline-block;width:22px;height:5px;border-radius:2px;margin-right:6px;vertical-align:middle}
#plan{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;touch-action:pan-y}
#plan .floor{fill:var(--floor)}
#plan .wall{fill:none;stroke:var(--ink);stroke-width:3}
#plan .stage{fill:var(--stage)}
#plan .stage-t{fill:var(--stage-ink);font-family:var(--f-disp);font-size:15px;letter-spacing:.2em}
#plan .rl{font-family:var(--f-disp);font-size:12px;letter-spacing:.08em;font-weight:500}
#plan .run{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 6;opacity:.9}
#plan .run.hot{stroke-width:9;stroke-dasharray:none;opacity:1}
#plan .dimt{fill:var(--muted);font-family:var(--f-mono);font-size:12px}
#plan .tw{fill:var(--case);stroke:var(--rail);stroke-width:2}
#plan .front{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
#plan .tagt{fill:#fff;font-family:var(--f-disp);font-weight:600;font-size:26px;text-anchor:middle}
#plan .subt{fill:var(--case-ink);font-family:var(--f-mono);font-size:10px;text-anchor:middle}
#plan .fu{fill:var(--furn);stroke:var(--muted);stroke-width:1.2}
#plan .fut{fill:var(--muted);font-size:11px;text-anchor:middle;font-family:var(--f-body)}
#plan .obj{cursor:grab;touch-action:none}
#plan .obj.sel .tw,#plan .obj.sel .fu{stroke:var(--accent);stroke-width:4}
#plan .obj.bad .tw,#plan .obj.bad .fu{stroke:var(--err);stroke-width:4}
#plan .lrect{fill:var(--ink)}
#plan .ring{fill:transparent;stroke:var(--ink);stroke-width:1.4;opacity:.7}
#plan .obj.sel .ring{stroke:var(--accent);stroke-width:3;opacity:1}
#plan .badge{fill:var(--accent)}
#plan .badget{fill:#fff;font-size:9px;font-weight:600;text-anchor:middle;font-family:var(--f-mono)}
#plan .prev{fill:rgba(63,81,209,.18);stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
#plan .prev.no{fill:rgba(209,59,59,.2);stroke:var(--err)}


/* виды */
.viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-svg{width:100%;height:auto;display:block;background:var(--panel2);border:1px solid #000;border-radius:6px}
.top-svg text{font-family:var(--f-mono);font-size:3.6px;fill:var(--case-ink)}
.top-svg .dim{fill:var(--muted)}
.top-svg .gapw{fill:#FFC266}
.ct-case{fill:var(--case)} .ct-open{fill:var(--slot)}
.ti{cursor:pointer}
.ti rect{fill-opacity:.62;stroke:var(--face);stroke-width:.4}
.ti text{fill:#fff;font-size:3.4px}
.ti.sel rect{stroke:var(--accent);stroke-width:1.2;fill-opacity:.85}
.ritem.frac{padding:0 10px}
.ritem.frac .dm{display:none}
#elev{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#elev .tw{fill:var(--case);stroke:var(--rail);stroke-width:1}
#elev .it{fill:var(--face);stroke:var(--hole);stroke-width:.3}
#elev .fu{fill:var(--furn);stroke:var(--muted);stroke-width:1}
#elev .obj{cursor:grab;touch-action:none}
#elev .obj.sel .dkx{stroke:var(--accent);stroke-width:3}
#plan .dk2{fill-opacity:.92;stroke:var(--accent);stroke-dasharray:6 3}
#elev .obj.sel .tw,#elev .obj.sel .fu{stroke:var(--accent);stroke-width:3}
#elev .lab{fill:var(--ink);font-family:var(--f-mono);font-size:10px;text-anchor:middle}
#elev .lab2{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
#elev .eg{stroke:var(--grid);stroke-width:.8}
#elev .eye{stroke:var(--accent);stroke-dasharray:6 4;stroke-width:1.3}
#elev .lo{fill:var(--ink)}
#elev .floorl{fill:var(--ink)}
/* сворачиваемые блоки сводки */
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"▾";color:var(--muted);font-size:12px}
.sec:not([open])>summary::after{content:"▸"}
.sec>summary h2{margin:0}
.sec[open]>summary{margin-bottom:8px}

/* панель выбранного */
.inspector{position:sticky;bottom:8px;z-index:5;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.inspector .ttl{font-weight:600}
.inspector .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.inspector .grow{flex:1;min-width:140px}
.inspector select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.hint{color:var(--muted);font-size:13px}

/* сводка */
.side{display:flex;flex-direction:column;gap:10px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sec h2{font-family:var(--f-disp);font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row .n{font-weight:500;min-width:0}
.row .v{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}
.row.on .n{color:var(--accent)}
.gh{font-size:12px;font-weight:600;margin:8px 0 2px;display:flex;align-items:center;gap:6px}
.gh i{width:14px;height:4px;border-radius:2px;display:inline-block}
.warns{display:flex;flex-direction:column;gap:5px}
.w{padding:6px 9px;border-radius:6px;font-size:12.5px;background:var(--warn-bg);color:var(--warn);cursor:pointer}
.w.err{background:var(--err-bg);color:var(--err)}
.w.info{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.ok{color:var(--ok);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td{padding:3px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

/* прочее */
.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:6px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:260px;transform:translate(10px,10px)}
.ghost .mono{opacity:.8;font-size:11px;display:block}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90vw;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.modal h3{margin:0;font-family:var(--f-disp);font-weight:500;font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.modal label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:0}
.modal input,.modal select{padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);width:100%}
.modal .fr{display:flex;gap:8px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

@media (max-width:1180px){.layout{grid-template-columns:260px minmax(0,1fr)}.side{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .lib{position:static;max-height:340px;order:2}
  .work{order:1}.side{order:3;display:flex}
  h1{font-size:22px}
  .inspector{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== варианты оформления: «Спокойный» и «Фокус» (поверх исходного) ===== */
.drawer-btn{display:none}
.v-calm .proj,.v-calm #viewhint{display:none}
.v-calm h1{font-size:20px;letter-spacing:.01em}
.v-calm .stats{display:flex;flex-wrap:wrap;gap:4px 26px}
.v-calm .stat{background:none;border:0;padding:0;display:flex;align-items:baseline;gap:6px;min-width:0}
.v-calm .stat:nth-child(1),.v-calm .stat:nth-child(3),.v-calm .stat:nth-child(6){display:none}
.v-calm .stat .l{order:2;text-transform:none;letter-spacing:0;font-size:12.5px}
.v-calm .stat .v{font-family:var(--f-body);font-weight:600;font-size:17px}
.v-calm .stat .v small{font-size:12px}
.v-calm .layout{grid-template-columns:250px minmax(0,1fr) 290px;gap:22px}
.v-calm .lib{background:none;border:0;border-right:1px solid var(--line);border-radius:0;padding-right:8px}
.v-calm .lib-head{background:var(--bg);padding:0 0 8px;border:0}
.v-calm .lib-foot{border:0;padding:8px 0}
.v-calm .cat{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:600;font-size:12px;padding:12px 4px 3px}
.v-calm .card{border-left:0;padding:5px 6px;border-radius:6px;margin:0}
.v-calm .glyph{display:none}
.v-calm .card .add{opacity:0}
.v-calm .card:hover .add,.v-calm .card .add:focus-visible{opacity:1}
.v-calm .tabs{border-bottom:1px solid var(--line)}
.v-calm .tab{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;padding:6px 12px}
.v-calm .towers-scroll{gap:34px}
.v-calm .tag{background:var(--line);color:var(--ink);width:24px;height:24px;font-size:16px}
.v-calm .tower.on .tag{background:var(--accent);color:#fff}
.v-calm .case{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px}
.v-calm .c-head{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;color:var(--muted)}
.v-calm .c-head .x{color:var(--muted)}
.v-calm .rack{grid-template-columns:20px 1fr}
.v-calm.m-cm .rack{grid-template-columns:20px 1fr 24px}
.v-calm .ruler{color:var(--muted);opacity:1}
.v-calm .ruler.r{display:none}
.v-calm.m-cm .ruler.r{display:flex}
.v-calm .slots{background-color:var(--panel2);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);border-left:0;border-right:0;border-radius:3px}
.v-calm .ritem{background:var(--panel2);color:var(--ink);padding:0 10px 0 12px;border-radius:3px;box-shadow:inset 3px 0 0 var(--k,var(--k-misc)),0 0 0 1px var(--line)}
.v-calm .ritem.u1{padding-bottom:0}
.v-calm .ritem .dm{opacity:1;color:var(--muted)}
.v-calm .ritem.frac{padding:0 8px 0 10px}
.v-calm .ritem.on{box-shadow:inset 3px 0 0 var(--k,var(--k-misc)),0 0 0 2px var(--accent);outline:0}
.v-calm .ritem.bad{box-shadow:inset 3px 0 0 var(--err),0 0 0 2px var(--err)}
.v-calm .addcase{border-style:solid;border-color:var(--line);font-size:12.5px}
.v-calm .t-foot{font-size:11px}
.v-calm .new-tower{min-height:120px;border-width:1px}
.v-calm .boxcard{background:none}
.v-calm .ct-case{fill:var(--line)} .v-calm .ct-open{fill:var(--panel2)}
.v-calm .top-svg{border-color:var(--line)}
.v-calm .top-svg text{fill:var(--muted)}
.v-calm .ti text{fill:var(--ink)}
.v-calm .inspector.empty{display:none}
.v-calm .inspector{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.v-calm .side{gap:0}
.v-calm .sec{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0 6px}
.v-calm .sec h2{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink)}
.v-calm .w{border-radius:4px}
.v-calm .btn.pri{margin-top:10px}
/* Фокус: библиотека и сводка выезжают по кнопке, рабочая зона на всю ширину */
.v-focus .drawer-btn{display:inline-block}
.v-focus .layout{grid-template-columns:auto minmax(0,1fr) auto;gap:22px}
.v-focus .lib{display:none;width:270px}
.v-focus.lib-open .lib{display:block}
.v-focus .side{grid-column:auto;display:none;width:300px}
.v-focus.side-open .side{display:flex}
@media (max-width:760px){.v-calm .layout,.v-focus .layout{grid-template-columns:minmax(0,1fr)}.v-focus .lib,.v-focus .side{width:auto}.v-calm .lib{border-right:0}}

/* стопка без кофра */
.stackseg{border:1px dashed var(--muted);border-radius:7px;padding:5px 8px 8px}
.stackseg .c-head .x{color:var(--muted)}
.sbody{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:30px}
.sitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;min-width:0;max-width:100%;color:var(--face-ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(0,0,0,.06)),var(--face);box-shadow:inset 0 -3px 0 var(--k,var(--k-misc)),0 0 0 1px rgba(0,0,0,.5);border-radius:3px;overflow:hidden}
.sitem .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sitem .dm{font-family:var(--f-mono);font-size:10px;opacity:.85;white-space:nowrap}
.sitem.frac .dm{display:none}
.sitem.on{outline:2px solid var(--accent);outline-offset:1px}
.sitem.lifted{opacity:.35}
.ghost.del{background:var(--err);color:#fff}
.ghost.del::after{content:" · отпустите, чтобы удалить";font-weight:600}
.slots .ins-line{position:absolute;left:0;right:0;width:auto;z-index:4}
.case.lifted,.stackseg.lifted{opacity:.4}
.c-head{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.ins-line{height:3px;width:100%;background:var(--ok);border-radius:2px;flex:0 0 auto}
.tower.hot .stack{outline:2px dashed var(--ok);outline-offset:3px;border-radius:6px}
.top-svg.lt text{fill:var(--muted)}
.top-svg.lt .ti text{fill:var(--ink)}
.v-calm .sitem{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--k,var(--k-misc)),0 0 0 1px var(--line)}
.v-calm .sitem .dm{color:var(--muted);opacity:1}
.v-calm .sitem.on{box-shadow:inset 3px 0 0 var(--k,var(--k-misc)),0 0 0 2px var(--accent);outline:0}

/* нижнее окошко замечаний */
.v-calm .stat:nth-child(7){display:none}
.app{padding-bottom:60px}
.warnbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:1560px;margin:0 auto;z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);overflow:hidden}
.wb-head{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border:0;background:transparent;text-align:left}
.wb-head b{font-size:13px}
.wb-chip{border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.wb-chip.err{background:var(--err-bg);color:var(--err)}
.wb-chip.warn{background:var(--warn-bg);color:var(--warn)}
.wb-chip.info{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.wb-chip.ok{background:rgba(46,158,91,.14);color:var(--ok)}
.wb-first{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12.5px}
.wb-chev{color:var(--muted);margin-left:auto}
.wb-list{max-height:min(40vh,320px);overflow:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line)}
.inspector{bottom:66px}
.toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){.inspector{bottom:calc(66px + env(safe-area-inset-bottom,0px))}.wb-first{display:none}}

/* трассы, станки, руководство */
:root{--c-misc:#8A6FCF;--deck:#C9D0D5;--deck-line:#8E9AA3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--deck:#2E3A44;--deck-line:#4B5A66}}
:root[data-theme="dark"]{--deck:#2E3A44;--deck-line:#4B5A66}
.v-calm .stat:nth-child(7){display:flex}
#plan .run{pointer-events:none}
#plan .run.rsel{stroke-width:7}
#plan .runhit{fill:none;stroke:transparent;stroke-width:18;pointer-events:none}
#plan.pm-runs .runhit{pointer-events:stroke;cursor:pointer}
#plan.pm-runs .obj,#plan.pm-draw .obj{pointer-events:none}
#plan.pm-draw{cursor:crosshair}
#plan .vtx{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5;cursor:grab}
#plan .mid{cursor:copy}
#plan .mid circle{fill:var(--panel2);stroke:var(--accent);stroke-width:1.5}
#plan .mid path{stroke:var(--accent);stroke-width:1.5;fill:none}
#plan .drawl{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
#plan .dk{fill:var(--deck);stroke:var(--deck-line);stroke-width:1}
#plan .obj.sel .dk{stroke:var(--accent);stroke-width:3}
#plan .obj.bad .dk{stroke:var(--err);stroke-width:3}
#plan .dkt{fill:var(--muted);font-family:var(--f-mono);font-size:10px;text-anchor:middle}
#elev .dkx{fill:var(--deck);stroke:var(--deck-line);stroke-width:1}
.glyph .g-deck{background:var(--deck);border:1px solid var(--muted)}
.plan-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plan-tools select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.legend .lg{border:1px solid transparent;background:none;border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.legend .lg:hover{border-color:var(--line)}
.legend .lg.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.rn{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:3px 8px;font-weight:600;min-width:0;width:100%}
.guide-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:160;display:flex;justify-content:center;align-items:stretch;padding:16px}
.guide{background:var(--panel2);border:1px solid var(--line);border-radius:12px;width:min(1040px,100%);display:flex;overflow:hidden}
.g-toc{flex:0 0 220px;border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.g-toc b{font-family:var(--f-disp);font-weight:500;font-size:15px;padding:2px 8px 8px}
.g-toc button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px}
.g-toc button:hover{background:var(--panel)}
.g-body{flex:1;min-width:0;overflow:auto;padding:16px 26px 44px}
.g-head{display:flex;justify-content:flex-end;position:sticky;top:0;background:var(--panel2);padding-bottom:6px}
.g-body section{margin-bottom:36px;max-width:640px}
.g-body h3{font-family:var(--f-disp);font-weight:500;font-size:21px;margin:0 0 8px}
.g-body p{margin:0 0 8px;font-size:14px;line-height:1.55}
.gfig svg{width:100%;max-width:580px;height:auto;display:block;margin:10px 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.rlab{paint-order:stroke;stroke:var(--floor);stroke-width:3px;stroke-linejoin:round}
.glyph .g-mon{background:var(--case);border:1px solid var(--muted);border-radius:2px}
#plan .mn{fill:var(--case);stroke:var(--rail);stroke-width:1}
#plan .mnf{stroke:var(--k-video);stroke-width:3;stroke-linecap:round}
#plan .mnt{fill:#fff;font-family:var(--f-mono);font-size:9px;text-anchor:middle;pointer-events:none}
#plan .obj.sel .mn{stroke:var(--accent);stroke-width:2.5}
#plan .obj.bad .mn{stroke:var(--err);stroke-width:2.5}
#plan .obj.und .tw{stroke-dasharray:5 3;fill-opacity:.8}
#elev .mnx{fill:var(--case);stroke:var(--rail);stroke-width:1}
#elev .obj.sel .mnx{stroke:var(--accent);stroke-width:3}
.eyet{paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.kb{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
@media (max-width:760px){.g-toc{display:none}.guide-back{padding:0}.guide{border-radius:0}}

/* станки-столы и «в воздухе» */
:root{--dtab:#E6D3A0;--dtab-line:#B08A2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dtab:#4C4224;--dtab-line:#B8963A}}
:root[data-theme="dark"]{--dtab:#4C4224;--dtab-line:#B8963A}
#plan .dk2{fill:var(--dtab);fill-opacity:1;stroke:var(--dtab-line);stroke-width:1.5;stroke-dasharray:none}
#elev .obj.dtb .dkx{fill:var(--dtab)}
#elev .obj.dtb:not(.sel):not(.air) .dkx{stroke:var(--dtab-line)}
#plan .obj.air .tw,#plan .obj.air .fu,#plan .obj.air .dk,#plan .obj.air .mn{stroke:var(--err);stroke-width:3;stroke-dasharray:4 3}
#elev .obj.air .tw,#elev .obj.air .fu,#elev .obj.air .dkx,#elev .obj.air .mnx{stroke:var(--err);stroke-width:2.5;stroke-dasharray:4 3}
.legend .lg2{display:inline-flex;align-items:center;font-size:12.5px;color:var(--muted);padding:0 4px}
.legend .lg2 b{width:18px;height:12px;border:1px solid var(--deck-line);border-radius:2px}
</style>
</head>
<body>
<div class="app m-both" id="app">
  <header class="top">
    <div class="brand">
      <h1>Планер пультовой</h1>
      <span class="proj">Прототип · площадка FOH 7,0 × 4,5 м · в приложении оборудование берётся из общей библиотеки, здесь данные условные</span>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Единицы размеров">
        <button data-act="unit" data-u="u" aria-pressed="false">U</button>
        <button data-act="unit" data-u="cm" aria-pressed="false">см</button>
        <button data-act="unit" data-u="both" aria-pressed="true">U + см</button>
      </div>
      <button class="btn drawer-btn" data-act="drawer" data-d="lib">Библиотека</button><button class="btn drawer-btn" id="sideBtn" data-act="drawer" data-d="side">Спецификация</button>
      <button class="btn" data-act="guide">Руководство</button>
      <button class="btn" id="undoBtn" data-act="undo">Отменить</button>
      <button class="btn" data-act="reset">Сбросить пример</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Итоги"></section>

  <div class="layout">
    <aside class="lib" id="lib" aria-label="Библиотека оборудования">
      <div class="lib-head">
        <input type="search" id="q" placeholder="Поиск по библиотеке" aria-label="Поиск по библиотеке">
        <div class="chips" id="kinds" role="group" aria-label="Тип"></div>
      </div>
      <div class="lib-trash">Отпустите здесь, чтобы убрать</div>
      <div id="libList"></div>
      <div class="lib-foot"><button class="btn" style="width:100%" data-act="custom">+ Добавить в библиотеку</button></div>
    </aside>

    <main class="work">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-act="tab" data-tab="racks" aria-selected="true">Стойки и башни</button>
        <button class="tab" role="tab" data-act="tab" data-tab="plan" aria-selected="false">План пультовой</button>
      </div>
      <div class="viewbar"><span class="hint">Вид</span><div class="seg" role="group" aria-label="Вид"><button data-act="view" data-v="front" aria-pressed="true">Спереди</button><button data-act="view" data-v="top" aria-pressed="false">Сверху</button></div><span class="hint" id="viewhint"></span></div>
      <div id="main"></div>
      <div class="inspector" id="inspector"></div>
    </main>

    <aside class="side" id="side" aria-label="Спецификация"></aside>
  </div>
  <div class="warnbar" id="warnbar" role="region" aria-label="Замечания"></div>
  <div class="toast" id="toast" role="status"></div>
  <div id="modal"></div>
  <div id="guide"></div>
</div>

<script>
(function(){
'use strict';
var UCM=4.445, UH=26;
document.documentElement.style.setProperty('--uh',UH+'px');
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var nf=function(n,d){d=d==null?1:d;return String(+(+n).toFixed(d)).replace('.',',')};
var dv=function(v){return v>=10?String(Math.round(v)):nf(v,1)};
var _n=0, uid=function(){return 'i'+Date.now().toString(36)+(++_n)};

/* ---------- библиотека (условные данные) ---------- */

function hostOf(t,c){

    var I=furnI(f); if(I.kind==='monitor'||fid(I)==='chair')return;
    var sw=(f.r||0)%180!==0, w=sw?I.d:I.w, d=sw?I.w:I.d;

  });

function calc(){
  var T=S.towers.map(function(t){return {t:t,c:towerCalc(t)}});
  var B=bounds(), bad={}, air={}, warns=[];
  for(var i=0;i<B.length;i++){
    var a=B[i];
    if(a.x0<0||a.y0<0||a.x1>ROOM.w||a.y1>ROOM.d){bad[a.id]=1;warns.push({lvl:'err',text:a.name+': выходит за границы площадки',sel:{t:a.t,id:a.id}})}
    for(var j=i+1;j<B.length;j++){var b=B[j];if(layerPair(a,b,bad,warns))continue;if(!!a.deck!==!!b.deck||!!a.mon!==!!b.mon||(a.deck&&b.deck&&!!a.on!==!!b.on))continue;if(overlaps(a,b)){bad[a.id]=bad[b.id]=1;warns.push({lvl:'err',text:a.name+' пересекается с «'+b.name+'»',sel:{t:a.t,id:a.id}})}}
  }
  var L0s=B.filter(function(o){return o.deck&&!o.on});
  B.forEach(function(o){
    if(!o.deck||!o.on)return;
    var q4=[[o.x0+.5,o.y0+.5],[o.x1-.5,o.y0+.5],[o.x0+.5,o.y1-.5],[o.x1-.5,o.y1-.5]];
    var cov=q4.filter(function(q){return deckHAt(L0s,q[0],q[1])>=0}).length;
    if(cov<4){air[o.id]=1;warns.push({lvl:'err',text:o.name+(cov?': висит в воздухе, часть опоры за краем нижних станков':': висит в воздухе, под ним нет станков'),sel:{t:'furn',id:o.id}})}
  });
  var DK=B.filter(function(o){return o.deck});
  if(DK.length)B.forEach(function(o){
    if(o.deck||o.lay==='under')return;
    var pts=[[o.x0+.5,o.y0+.5],[o.x1-.5,o.y0+.5],[o.x0+.5,o.y1-.5],[o.x1-.5,o.y1-.5],[(o.x0+o.x1)/2,(o.y0+o.y1)/2]];
    var hs=pts.map(function(q){return deckHAt(DK,q[0],q[1])});
    var any=hs.some(function(h){return h>=0}), all=hs.every(function(h){return h>=0});
    if(any&&!all){air[o.id]=1;warns.push({lvl:o.mon?'warn':'err',text:o.name+(o.mon?': выходит за край станка':': висит в воздухе, часть опоры за краем станка'),sel:{t:o.t,id:o.id}})}
    else if(all&&hs.some(function(h){return h!==hs[0]})){air[o.id]=1;warns.push({lvl:o.mon?'warn':'err',text:o.name+': стоит на станках разной высоты, часть опоры в воздухе',sel:{t:o.t,id:o.id}})}
  });
  T.forEach(function(x){
    x.c.items.forEach(function(it){
      if(it.I.d<=it.K.inD&&it.K.inD-it.I.d<5)warns.push({lvl:'warn',text:it.I.name+': до задней крышки '+nf(it.K.inD-it.I.d,0)+' см, кабелям тесно',sel:{t:'ritem',id:it.item.id,tower:x.t.id,cas:it.caseObj.id}});
      if(it.I.d>it.K.inD)warns.push({lvl:'err',text:it.I.name+': глубина '+it.I.d+' см больше, чем внутри кофра ('+it.K.inD+' см)',sel:{t:'ritem',id:it.item.id,tower:x.t.id,cas:it.caseObj.id}});
      if(it.I.kg>=15&&it.upper)warns.push({lvl:'warn',text:'Башня '+x.t.tag+': «'+it.I.name+'» ('+nf(it.I.kg,0)+' кг) в верхней половине — тяжёлое лучше вниз',sel:{t:'ritem',id:it.item.id,tower:x.t.id,cas:it.caseObj.id}});
    });
    if(x.c.h>150)warns.push({lvl:'warn',text:'Башня '+x.t.tag+' выше 1,5 м ('+nf(x.c.h,0)+' см) — может закрывать обзор',sel:{t:'tower',id:x.t.id}});
    if(x.t.cases.length&&x.c.used===0&&!x.c.sn)warns.push({lvl:'info',text:'Башня '+x.t.tag+' пока пустая',sel:{t:'tower',id:x.t.id}});
  });
  var free=S.loose.filter(function(l){return l.mode==='free'}).length;
  if(free)warns.push({lvl:'info',text:'Без привязки лежит: '+free+' шт. Это нормально для мелочи, но кабель до неё надо учесть'});
  var tot={towers:T.length,U:0,used:0,kg:0,p:0,floor:0,cases:0};
  T.forEach(function(x){tot.U+=x.c.U;tot.used+=x.c.used;tot.kg+=x.c.kg;tot.p+=x.c.p;tot.floor+=x.c.fw*x.c.fd/10000;tot.cases+=x.c.cases});
  tot.deck=deckInfo(B); S.furn.forEach(function(f){var FI=furnI(f);tot.kg+=FI.kg;tot.p+=FI.p||0});
  var box=boxCalc(); tot.kg+=box.kg; tot.p+=box.p; if(box.n)tot.cases+=1;
  if(tot.p>3680)warns.push({lvl:'warn',text:'Нагрузка '+nf(tot.p/230,1)+' А — больше одной линии 16 А'});
  return {T:T,warns:warns,bad:bad,air:air,tot:tot,box:box};
}

function runLabel(r){
  var first=Math.hypot(r.pts[1][0]-r.pts[0][0],r.pts[1][1]-r.pts[0][1]), best=0, bl=0;
  if(first<60)for(var i=0;i<r.pts.length-1;i++){var l=Math.hypot(r.pts[i+1][0]-r.pts[i][0],r.pts[i+1][1]-r.pts[i][1]);if(l>bl){bl=l;best=i}}
  var a=r.pts[best], b=r.pts[best+1], ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
  while(ang>=90)ang-=180;
  while(ang<-90)ang+=180;
  return '<text class="rl rlab" transform="translate('+((a[0]+b[0])/2)+' '+((a[1]+b[1])/2)+') rotate('+ang.toFixed(1)+')" y="-8" text-anchor="middle" style="fill:var('+r.cv+')">'+esc(r.name)+'</text>';
}

function pushLayout(cs,I,b,c0,selfId){
  var K=lib(cs.caseId), cw=cwOf(I);
  var its=cs.items.filter(function(i){return i.id!==selfId}).map(function(i){var J=lib(i.libId);return {id:i.id,u0:i.u0,u:J.u,c0:i.c0||0,cw:cwOf(J)}});
  its.forEach(function(x){if(x.c0<c0+cw&&x.c0+x.cw>c0&&x.u0<b&&b<x.u0+x.u)b=(b-x.u0<=x.u0+x.u-b)?x.u0:x.u0+x.u});
  if(b+I.u>K.u)return null;
  var placed=[{u0:b,u:I.u,c0:c0,cw:cw}], moves={};
  its.sort(function(a,z){return a.u0-z.u0});
  for(var k=0;k<its.length;k++){
    var x=its[k], top=x.u0, again=true, guard=0;
    while(again&&guard++<60){again=false;for(var q=0;q<placed.length;q++){var pl=placed[q];if(pl.c0<x.c0+x.cw&&pl.c0+pl.cw>x.c0&&top<pl.u0+pl.u&&top+x.u>pl.u0){top=pl.u0+pl.u;again=true}}}
    if(top+x.u>K.u)return null;
    if(top!==x.u0)moves[x.id]=top;
    placed.push({u0:top,u:x.u,c0:x.c0,cw:x.cw});
  }
  return {u0:b,moves:moves};
}
function insertSeg(tw,seg,posTop,movedId){
  var L=tw.cases.slice().reverse();
  if(movedId){var oi=-1;L.forEach(function(x,k){if(x.id===movedId)oi=k});if(oi>=0){L.splice(oi,1);if(oi<posTop)posTop--}}
  L.splice(Math.max(0,Math.min(L.length,posTop)),0,seg);tw.cases=L.reverse();
}
function segInsTarget(tw,e){
  var segs=$$('.stack>.case,.stack>.stackseg',tw), pos=segs.length;
  for(var q=0;q<segs.length;q++){var r=segs[q].getBoundingClientRect();if(e.clientY<r.top+r.height/2){pos=q;break}}
  return {type:'segins',el:tw,t:tw.dataset.tower,pos:pos,segs:segs};
}
function fits(cs,u0,u,selfId,c0,cw){
  c0=c0||0;cw=cw||12;
  var K=lib(cs.caseId); if(u0<0||u0+u>K.u||c0<0||c0+cw>12)return false;
  return cs.items.every(function(i){if(i.id===selfId)return true;var I=lib(i.libId),ic=i.c0||0,iw=cwOf(I);
    return u0+u<=i.u0||u0>=i.u0+I.u||c0+cw<=ic||c0>=ic+iw});
}

  var I=libId?lib(libId):null, spot=at||findSpot(I?Math.max(I.w,20):50,I?Math.max(I.d,20):30), tag=nextTag();
  var t={id:uid(),tag:tag,name:'Башня '+tag,x:spot.x,y:spot.y,r:0,cases:[{id:uid(),stack:true,items:libId?[{id:uid(),libId:libId}]:[]}]};

function autoPlace(t,I){

  return false;
}
function findSpot(w,d){

  for(var y=ROOM.d-d/2-10;y>=d/2+10;y-=10)for(var x=w/2+10;x<=ROOM.w-w/2-10;x+=10){
    var b={x0:x-w/2,x1:x+w/2,y0:y-d/2,y1:y+d/2};if(!B.some(function(o){return overlaps(b,o)}))return {x:x,y:y}}

}

function findDeckOnSpot(I,excl){

  var y0=Math.min.apply(null,L0.map(function(b){return b.y0})), y1=Math.max.apply(null,L0.map(function(b){return b.y1}));

function gl(x1,y1,x2,y2,c,w,dash){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="stroke:'+c+';stroke-width:'+(w||1.5)+(dash?';stroke-dasharray:'+dash:'')+'"/>'}
function ga(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#gah)" style="stroke:var(--accent);stroke-width:2"/>'}
function gc(x,y,r,f,st){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" style="fill:'+f+';stroke:'+(st||'none')+';stroke-width:2"/>'}
function gpoly(pts,c,w,dash){return '<polyline points="'+pts+'" fill="none" style="stroke:'+c+';stroke-width:'+(w||4)+';stroke-linecap:round;stroke-linejoin:round'+(dash?';stroke-dasharray:'+dash:'')+'"/>'}

var GUIDE=[
 {id:'start',t:'Экран и общая идея',f:figStart,p:['Планер собирает пультовую: башни из рэк-кофров, оборудование без кофров, мелочь на трассах кабеля и пол из станков.','Слева библиотека, в центре рабочая зона с вкладками «Стойки и башни» и «План пультовой», справа спецификация (кнопка в шапке), внизу окошко замечаний.','Размеры показываются в юнитах и сантиметрах. Переключатель «U / см / U + см» в шапке выбирает, что видно. В приложении оборудование будет браться из общей библиотеки, в прототипе данные условные.']},
 {id:'tower',t:'Башни из кофров',f:figTower,p:['Перетащите рэк-кофр на пустую зону «новая башня» или нажмите «+» на карточке. Блок из библиотеки перетаскивается в слот кофра. Кнопка «+ сверху…» над башней ставит ещё один кофр или стопку без кофра.','Блок, брошенный на занятое место, вставляется между соседями: нижние сдвигаются вниз, если им хватает места (появляется зелёная линия). Кофры и стопки тоже переносятся: берите за заголовок и бросайте между другими слоями башни или на «новая башня». Кнопка «+ снизу…» ставит слой под башню, «+ сверху…» над ней. Блок можно переносить между слотами и между башнями. Чтобы убрать, перетащите его в пустое место рабочей зоны или в библиотеку, либо нажмите Delete. Любое удаление отменяется кнопкой «Отменить» или Ctrl+Z.']},
 {id:'width',t:'Доли ширины',f:figWidth,p:['По умолчанию всё занимает 19″. Блоки 1/2, 1/3 и 1/4 rack встают в один ряд юнитов рядом друг с другом. Перетаскивайте блок к нужной части ряда, предпросмотр покажет, куда он ляжет.']},
 {id:'stack',t:'Оборудование без кофра',f:figStack,p:['Контроллеры часто лежат друг на друге без рэка и кофра. Для этого у башни есть слой «Стопка без кофра»: высота считается по габаритам, площадь на полу по самому широкому и глубокому предмету.','Если выбрана башня, «+» на карточке кладёт мелочь или блок в её стопку. Если в кофрах нет места, блок тоже ляжет стопкой сверху.']},
 {id:'views',t:'Вид спереди и сверху',f:figViews,p:['Переключатель «Вид» работает на обеих вкладках. В башнях: спереди лицевые панели, сверху глубина оборудования и запас сзади. На плане: сверху обычный план, спереди высоты башен и мебели с линией глаз оператора.','В башнях виды сверху и спереди только для просмотра. На плане вид спереди тоже позволяет двигать объекты: вбок по плану, вверх на стол, станок или башню, вниз на пол или под стол. Позже можно добавить полноценную 3D-отрисовку.']},
 {id:'plan',t:'План и трассы',f:figPlan,p:['Мелочь (конвертеры и подобное) не привязана к стойкам. Отпустите её ближе 30 см к трассе, и она встанет на трассу и запомнит расстояние от ввода. Можно оставить её свободной или убрать в кейс мелочёвки.','Кнопка «Трассы» над планом включает редактирование. Кнопка «＋ Нарисовать трассу»: ставьте точки кликами, двойной клик или «Готово» завершает. Точки трассы тяните, кружок с плюсом на отрезке добавляет точку, двойной клик по точке удаляет её. Название трассы пишется на плане вдоль линии. Тип и название меняются в нижней панели, «Развернуть» меняет направление ввода.']},
 {id:'decks',t:'Станки и пол',f:figDeck,p:['Пультовая чаще всего стоит на станках, поэтому в библиотеке есть вкладка «Станки». Они ложатся по сетке 50 см. Башни и мебель на станках не считаются пересечением, а пол из станков показывается в итогах как габариты в метрах и площадь.','Высота станка поднимает башни и мебель на виде спереди, а линия глаз оператора отсчитывается от пола станка, на котором стоит стул. Если объект выходит за край станка или стоит на станках разной высоты, внизу появится предупреждение. Башни и мебель на станках не считаются пересечением: станок работает как пол или как стол. Станок, стоящий сверху на станках пола, выделен тёплым цветом как «станок-стол». Если стол, станок-стол, башня или стул висят в воздухе (часть опоры за краем станка или на станках разной высоты), внизу появится ошибка, а объект подсветится красным пунктиром.']},
 {id:'mon',t:'Мониторы',f:figMon,p:['В библиотеке есть вкладка «Мониторы» от 15,6″ до 55″ с габаритами, весом и мощностью. Монитор ставится на стол или сверху на башню, на плане он рисуется с яркой чертой со стороны экрана.','Монитор можно повернуть клавишей R. Вес и мощность попадают в итоги и спецификацию, размеры и мощность редактируются правым кликом.']},
 {id:'layer',t:'Башни на столах и под ними',f:figLayer,p:['Башню можно ставить на стол или станок и под них. Станки нередко работают вместо столов, поэтому правила для них такие же.','Выберите башню и задайте положение в нижней панели: «Авто», «На столе или станке», «Под столом или станком». Проверки: башня должна помещаться целиком на столе, а под столом её высота должна быть меньше высоты стола. Тяжёлая башня на столе (больше 40 кг) даёт предупреждение. На виде спереди башня поднимается на высоту стола или станка.','На виде спереди то же делается перетаскиванием: поднимите башню над столом или станком, чтобы поставить её сверху, опустите на пол, чтобы поставить под стол. Станок, добавленный на виде спереди, по умолчанию встаёт сверху на станки пола как стол. Положение станка можно сменить в нижней панели.']},
 {id:'edit',t:'Редактор по правому клику',f:figEditor,p:['Правый клик по мебели или станку на плане (или кнопка «Параметры…» в нижней панели) открывает редактор: название, ширина, глубина, высота и вес.','«Применить» меняет только выбранный объект. «Сохранить как пресет» добавляет новую позицию в библиотеку, и она встаёт на место этого объекта. Свои позиции библиотеки удаляются крестиком на карточке, если они нигде не используются.']},
 {id:'keys',t:'Клавиши',f:null,p:['<span class="kb">Delete</span> убрать выбранное. <span class="kb">R</span> повернуть башню, мебель или станок. <span class="kb">Ctrl+Z</span> отменить. <span class="kb">Esc</span> снять выделение, закрыть окно или отменить рисование трассы. <span class="kb">Backspace</span> в режиме рисования убирает последнюю точку, <span class="kb">Enter</span> завершает трассу.']}
];

/* ---------- перетаскивание ---------- */
var drag=null;
function startDrag(e,info){
  if(e.button!=null&&e.button>0)return;
  drag={info:info,sx:e.clientX,sy:e.clientY,active:false,ghost:null,pid:e.pointerId};
  window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onCancel);
}
function dragItem(){var i=drag.info;return i.src==='lib'?lib(i.libId):i.src==='ritem'?lib(i.libId):null}
function svgPt(e){var svg=$('#plan')||$('#elev');if(!svg)return null;var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var m=svg.getScreenCTM();if(!m)return null;var p=pt.matrixTransform(m.inverse());return {x:p.x,y:p.y}}
function clearPrev(){$$('.slot-prev,.ins-line').forEach(function(n){n.remove()});$$('.hot').forEach(function(n){if(n.classList.contains('new-tower')||n.classList.contains('boxcard')||n.classList.contains('tower'))n.classList.remove('hot')});$('#lib').classList.remove('over-trash')}
function target(e){
  var info=drag.info, I=dragItem(), el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el)return null;
  if(el.closest('#lib'))return info.src!=='lib'?{type:'trash',lib:true}:null;
  if(el.closest('#plan')){
    var p=svgPt(e);if(!p)return null;
    return {type:'plan',p:p};
  }
  if(el.closest('#elev')){var pe=svgPt(e);return pe?{type:'elev',p:pe}:null}
  var topv=S.tab==='racks'&&S.view.racks==='top';
  if(info.src==='seg'){
    if(topv)return null;
    if(el.closest('.new-tower'))return {type:'newtower',el:el.closest('.new-tower')};
    var tws=el.closest('.tower');
    return tws?segInsTarget(tws,e):null;
  }
  var sl=el.closest('.slots');
  if(sl&&I&&I.kind==='rack'){
    var cs=getCase(sl.dataset.tower,sl.dataset.case);if(!cs)return null;
    var K=lib(cs.caseId), rect=sl.getBoundingClientRect(), u0=Math.round((e.clientY-rect.top)/UH-I.u/2);
    u0=Math.max(0,Math.min(K.u-I.u,u0));
    var cw=cwOf(I), relx=(e.clientX-rect.left)/rect.width, kk=Math.max(0,Math.min(12/cw-1,Math.floor(relx*12/cw))), c0=kk*cw;
    var selfId=info.src==='ritem'?info.id:null;
    if(fits(cs,u0,I.u,selfId,c0,cw))return {type:'slot',el:sl,cs:cs,t:sl.dataset.tower,u0:u0,c0:c0,cw:cw,ok:true};
    var bb=Math.max(0,Math.min(K.u,Math.round((e.clientY-rect.top)/UH))), lay=pushLayout(cs,I,bb,c0,selfId);
    if(lay)return {type:'slot',el:sl,cs:cs,t:sl.dataset.tower,u0:lay.u0,b:lay.u0,c0:c0,cw:cw,ok:true,insert:true,lay:lay};
    return {type:'slot',el:sl,cs:cs,t:sl.dataset.tower,u0:u0,c0:c0,cw:cw,ok:false};
  }
  if(I&&(I.kind==='rack'||I.kind==='loose')){
    var ss=el.closest('.stackseg');
    if(ss&&!topv){var its=$$('[data-sitem]',ss),pos=its.length;for(var q=0;q<its.length;q++){var rr=its[q].getBoundingClientRect();if(e.clientY<rr.top+rr.height/2){pos=q;break}}
      return {type:'stack',el:ss,t:ss.dataset.tower,seg:ss.dataset.seg,pos:pos,its:its}}
    if(el.closest('.new-tower'))return {type:'newstack',el:el.closest('.new-tower')};
  }
  if(I&&I.kind==='case'){
    if(el.closest('.new-tower'))return {type:'newtower',el:el.closest('.new-tower')};
    var twc=el.closest('.tower');
    if(twc&&!topv)return segInsTarget(twc,e);
    if(twc)return {type:'newtower',el:$('.new-tower')};
  }
  if(I&&I.kind==='loose'&&el.closest('.boxcard'))return {type:'box',el:el.closest('.boxcard')};
  if(I&&(I.kind==='rack'||I.kind==='loose')&&el.closest('.tower')&&!topv){var tw=el.closest('.tower');return {type:'towerstack',el:tw,t:tw.dataset.tower}}
  if(info.src==='ritem'&&el.closest('#main')&&!el.closest('.boxcard'))return {type:'trash'};
  return null;
}
function onMove(e){
  if(!drag)return;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;
    drag.active=true;document.body.classList.add('dragging');
    var info=drag.info;
    if(info.src==='plan'&&!info.nosnap){snap()}
    if(info.src==='seg'){var sgel=$('[data-segid="'+info.seg+'"]');if(sgel)sgel.classList.add('lifted')}
    if(info.src==='ritem'){var n=$('[data-ritem="'+info.id+'"],[data-sitem="'+info.id+'"]');if(n)n.classList.add('lifted')}
    var g=document.createElement('div');g.className='ghost';
    var I=dragItem();
    g.innerHTML=(info.src==='plan'||info.src==='seg')?esc(info.label||'Объект'):esc(I.name)+'<span class="mono">'+esc(plain(dimStr(I)))+'</span>';
    if(info.kind==='vtx'||info.kind==='elev')g.style.display='none';
    document.body.appendChild(g);drag.ghost=g;
  }
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  var info2=drag.info;
  if(info2.src==='plan'&&info2.kind==='elev'){elevMove(info2,e);return}
  if(info2.src==='plan'){
    var p=svgPt(e);if(!p)return;
    var o=planObj(info2);if(!o)return;
    if(info2.kind==='vtx'){var vp=snapRunPt(p);o.pts[info2.idx]=[vp.x,vp.y];renderPlan();return}
    var px=p.x+info2.dx, py=p.y+info2.dy;
    if(info2.kind==='loose'){
      var best=null;RUNS.forEach(function(r){var n=nearestOnRun(r,p.x,p.y);if(!best||n.d<best.d)best=n});
      if(best&&best.d<SNAP){o.mode='run';o.run=best.run;o.s=best.s;S.snapHint=best.run}
      else{o.mode='free';delete o.run;o.x=Math.max(-30,Math.min(ROOM.w+30,p.x));o.y=Math.max(-30,Math.min(ROOM.d+30,p.y));S.snapHint=null}
    }else{var q2=snapPos(info2.kind,o,px,py);o.x=q2.x;o.y=q2.y}
    CALC=calc();renderPlan();return;
  }
  clearPrev();
  var tg=target(e);drag.tg=tg;drag.ghost.classList.toggle('del',!!(tg&&tg.type==='trash'));
  if(S.preview||S.snapHint){S.preview=null;S.snapHint=null;if(S.tab==='plan')renderPlan()}
  if(!tg)return;
  var I2=dragItem();
  if(tg.type==='trash'){if(tg.lib)$('#lib').classList.add('over-trash')}
  else if(tg.type==='slot'){if(tg.insert){var il=document.createElement('div');il.className='ins-line';il.style.top=(tg.b*UH-1)+'px';tg.el.appendChild(il)}var pv=document.createElement('div');pv.className='slot-prev'+(tg.ok?'':' no');pv.style.top=(tg.u0*UH)+'px';pv.style.height=(I2.u*UH)+'px';pv.style.left=(tg.c0/12*100)+'%';pv.style.width=(tg.cw/12*100)+'%';pv.style.right='auto';tg.el.appendChild(pv)}
  else if(tg.type==='stack'){var ln=document.createElement('div');ln.className='ins-line';tg.el.querySelector('.sbody').insertBefore(ln,tg.its[tg.pos]||null)}
  else if(tg.type==='segins'){var ln2=document.createElement('div');ln2.className='ins-line';tg.el.querySelector('.stack').insertBefore(ln2,tg.segs[tg.pos]||tg.el.querySelector('[data-addcase-bottom]'))}
  else if(tg.type==='newtower'||tg.type==='box'||tg.type==='newstack'||tg.type==='towerstack'){if(tg.el)tg.el.classList.add('hot')}
  else if(tg.type==='plan'){
    var pp=tg.p, w=I2.kind==='case'?I2.w:I2.w, d=I2.kind==='case'?I2.d:I2.d, ok=true;
    if(I2.kind==='rack'){var hit=towerAt(pp);ok=!!hit;w=hit?towerCalc(hit).fw:48;d=hit?towerCalc(hit).fd:30}
    if(I2.kind==='loose'){var best2=null;RUNS.forEach(function(r){var n=nearestOnRun(r,pp.x,pp.y);if(!best2||n.d<best2.d)best2=n});S.snapHint=best2&&best2.d<SNAP?best2.run:null;w=I2.w;d=I2.d}
    if(I2.kind==='deck'||I2.kind==='furn'||I2.kind==='monitor'||I2.kind==='case')pp=snapDrop(I2,pp);
    S.preview={x:pp.x,y:pp.y,w:Math.max(w,12),d:Math.max(d,12),ok:ok};
    renderPlan();
  }
}
function towerAt(p){
  var f=null;S.towers.forEach(function(t){var c=towerCalc(t);if(Math.abs(p.x-t.x)<=c.fw/2&&Math.abs(p.y-t.y)<=c.fd/2)f=t});return f;
}
function planObj(info){
  if(info.kind==='vtx')return runById(info.id);
  if(info.kind==='tower')return S.towers.filter(function(t){return t.id===info.id})[0];
  if(info.kind==='furn')return S.furn.filter(function(t){return t.id===info.id})[0];
  return S.loose.filter(function(t){return t.id===info.id})[0];
}
function endDrag(){
  window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel);
  if(drag&&drag.ghost)drag.ghost.remove();
  document.body.classList.remove('dragging');clearPrev();S.preview=null;S.snapHint=null;
}
function onCancel(){var d=drag;endDrag();drag=null;if(d&&d.active)render()}
function onUp(e){
  var d=drag;if(!d){endDrag();return}
  if(!d.active){endDrag();drag=null;return}
  var info=d.info, tg=info.src==='plan'?null:target(e);
  endDrag();drag=null;
  if(info.src==='plan'){persist();render();return}
  if(info.src==='seg'){
    if(!tg){render();return}
    var srcT=S.towers.filter(function(x){return x.id===info.tower})[0], sgm=srcT&&srcT.cases.filter(function(c){return c.id===info.seg})[0];
    if(!sgm){render();return}
    if(tg.type==='segins'){
      mutate(function(){
        var tw=S.towers.filter(function(x){return x.id===tg.t})[0], same=tw===srcT;
        if(!same){srcT.cases=srcT.cases.filter(function(c){return c!==sgm});if(!srcT.cases.length)S.towers=S.towers.filter(function(x){return x!==srcT})}
        insertSeg(tw,sgm,tg.pos,same?sgm.id:null);S.sel={t:'tower',id:tw.id};
      });
      return;
    }
    if(tg.type==='newtower'){
      mutate(function(){
        srcT.cases=srcT.cases.filter(function(c){return c!==sgm});if(!srcT.cases.length)S.towers=S.towers.filter(function(x){return x!==srcT});
        var tag=nextTag(), sp=findSpot(60,70), nt={id:uid(),tag:tag,name:'Башня '+tag,x:sp.x,y:sp.y,r:0,cases:[sgm]};S.towers.push(nt);S.sel={t:'tower',id:nt.id};
      });
      toast('Слой вынесен в новую башню');return;
    }
    render();return;
  }
  var I=info.src==='lib'?lib(info.libId):lib(info.libId);
  if(!tg){render();return}
  if(tg.type==='trash'){
    if(info.src==='ritem'){var f=findRitem(info.id),nm=lib(info.libId).name;mutate(function(){f.c.items.splice(f.k,1);S.sel=null});toast('Удалено: «'+nm+'». Отменить: Ctrl+Z или кнопка «Отменить»')}
    else render();
    return;
  }
  if(tg.type==='slot'){
    if(!tg.ok){toast('Сюда не помещается: '+I.u+'U'+(FRAC[I.cw]?' '+FRAC[I.cw]:''));render();return}
    mutate(function(){
      if(info.src==='ritem'){var f2=findRitem(info.id);f2.c.items.splice(f2.k,1)}
      if(tg.insert)tg.cs.items.forEach(function(i){if(tg.lay.moves[i.id]!=null)i.u0=tg.lay.moves[i.id]});
      var id=info.src==='ritem'?info.id:uid();
      tg.cs.items.push({id:id,libId:info.libId,u0:tg.u0,c0:tg.c0});
      S.sel={t:'ritem',id:id,tower:tg.t,cas:tg.cs.id};
    });
    return;
  }
  if(tg.type==='stack'||tg.type==='towerstack'||tg.type==='newstack'){
    if(I.kind!=='rack'&&I.kind!=='loose'){render();return}
    mutate(function(){
      var moved=info.src==='ritem'?findRitem(info.id):null, item, same=false;
      if(moved){item={id:moved.i.id,libId:moved.i.libId};same=tg.type==='stack'&&moved.c.id===tg.seg;if(!same)moved.c.items.splice(moved.k,1)}
      else item={id:uid(),libId:I.id};
      var tw=tg.type==='newstack'?newStackTower(null):S.towers.filter(function(x){return x.id===tg.t})[0];
      var seg=tg.type==='stack'?tw.cases.filter(function(c){return c.id===tg.seg})[0]:topStack(tw);
      insertStack(seg,item,tg.type==='stack'?tg.pos:0,same?item.id:null);
      S.sel={t:'sitem',id:item.id,tower:tw.id,seg:seg.id};
    });
    return;
  }
  if(tg.type==='segins'&&I.kind==='case'){mutate(function(){var tw=S.towers.filter(function(x){return x.id===tg.t})[0];insertSeg(tw,{id:uid(),caseId:I.id,items:[]},tg.pos,null);S.sel={t:'tower',id:tw.id}});toast('Кофр добавлен в башню');return}
  if(tg.type==='newtower'&&I.kind==='case'){mutate(function(){newTower(I.id)});toast('Новая башня собрана');return}
  if(tg.type==='box'&&I.kind==='loose'){mutate(function(){var o={id:uid(),libId:I.id,mode:'box'};S.loose.push(o);S.sel={t:'loose',id:o.id}});return}
  if(tg.type==='elev'){
    if(info.src!=='lib'||(I.kind!=='furn'&&I.kind!=='deck'&&I.kind!=='monitor')){toast('Башни и оборудование кладутся на вкладке «Стойки и башни» или на плане сверху. Здесь можно ставить станки, мебель и мониторы');render();return}
    mutate(function(){
      var o={id:uid(),libId:I.id,x:tg.p.x,y:ROOM.d/2,r:0}, dks=bounds().filter(function(b){return b.deck&&!b.on});
      if(dks.length)o.y=dks[0].cy;
      var r=elevSnap('furn',o,tg.p.x,-tg.p.y);o.x=r.x;o.y=r.y;if(r.on&&I.kind==='deck')o.on=true;
      S.furn.push(o);S.sel={t:'furn',id:o.id};
    });
    return;
  }
  if(tg.type==='plan'){
    var p=tg.p;
    if(p.x<-40||p.x>ROOM.w+40||p.y<-40||p.y>ROOM.d+40){render();return}
    if(I.kind==='case'){mutate(function(){newTower(I.id,{x:Math.round(p.x/5)*5,y:Math.round(p.y/5)*5})});return}
    if(I.kind==='loose'){var tl=towerAt(p);if(tl){mutate(function(){addToStack(tl,I.id)});toast('«'+I.name+'» лёг стопкой в башню '+tl.tag);return}mutate(function(){placeLoose(I.id,p)});return}
    if(I.kind==='furn'||I.kind==='deck'||I.kind==='monitor'){var qd=snapDrop(I,p);mutate(function(){var o={id:uid(),libId:I.id,x:qd.x,y:qd.y,r:0};S.furn.push(o);S.sel={t:'furn',id:o.id}});return}
    if(I.kind==='rack'){
      var t=towerAt(p);
      if(!t){mutate(function(){newStackTower(I.id,{x:Math.round(p.x/5)*5,y:Math.round(p.y/5)*5})});toast('Новая башня: оборудование лежит без кофра');return}
      snap();var ok=autoPlace(t,I);if(!ok)addToStack(t,I.id);
      S.sel={t:'tower',id:t.id};persist();render();toast(ok?'Добавлено в кофр башни '+t.tag:'Нет места в кофрах: лёг стопкой сверху башни '+t.tag);return;
    }
  }
  render();
}

    startDrag(e,{src:'ritem',id:id,libId:f.i.libId});return;
  }

    var se=chd.closest('.case,.stackseg');
    if(se&&se.dataset.tower&&se.dataset.segid){startDrag(e,{src:'seg',tower:se.dataset.tower,seg:se.dataset.segid,label:(chd.querySelector('.grow')||chd).textContent.trim()});return}
  }
  var si=e.target.closest('.sitem');
  if(si){
    var sb=si.closest('.stackseg'), sid=si.dataset.sitem, sf=findRitem(sid);
    if(!sf)return;
    S.sel={t:'sitem',id:sid,tower:sb.dataset.tower,seg:sb.dataset.seg};
    $$('.sitem.on,.ritem.on').forEach(function(n){n.classList.remove('on')});si.classList.add('on');renderInspector();renderStats();
    startDrag(e,{src:'ritem',id:sid,libId:sf.i.libId});return;
  }
  var eo=e.target.closest('#elev .obj[data-id]');
  if(eo){
    var ek=eo.dataset.t, eid=eo.dataset.id, ep=svgPt(e), eob=planObj({kind:ek,id:eid});
    if(eob&&ep){
      S.sel={t:ek,id:eid};
      $$('#elev .obj.sel').forEach(function(n){n.classList.remove('sel')});eo.classList.add('sel');renderInspector();
      startDrag(e,{src:'plan',kind:'elev',what:ek,id:eid,dx:eob.x-ep.x,dh:(+eo.dataset.base||0)+ep.y,label:''});
      return;
    }
  }
  if(S.pmode!=='obj'&&e.target.closest('#plan')){
    if(S.pmode==='draw'){
      var dpt=svgPt(e); if(!dpt)return;
      var sp=snapRunPt(dpt), last=S.drawPts[S.drawPts.length-1];
      if(!last||Math.hypot(last[0]-sp.x,last[1]-sp.y)>3)S.drawPts.push([sp.x,sp.y]);
      renderPlan();return;
    }
    var vt=e.target.closest('[data-vtx]'), md=e.target.closest('[data-mid]'), rh=e.target.closest('[data-run]');
    var RS=S.sel&&S.sel.t==='run'?runById(S.sel.id):null;
    if(vt&&RS){startDrag(e,{src:'plan',kind:'vtx',id:RS.id,idx:+vt.dataset.vtx,dx:0,dy:0,label:''});return}
    if(md&&RS){var mi=+md.dataset.mid, pa=RS.pts[mi], pb=RS.pts[mi+1];snap();RS.pts.splice(mi+1,0,[Math.round((pa[0]+pb[0])/10)*5,Math.round((pa[1]+pb[1])/10)*5]);persist();renderPlan();startDrag(e,{src:'plan',kind:'vtx',id:RS.id,idx:mi+1,dx:0,dy:0,label:'',nosnap:true});return}
    if(rh){S.sel={t:'run',id:rh.dataset.run};renderPlan();renderPlanTools();renderInspector();return}
    return;
  }
  var ob=e.target.closest('[data-obj]');
  if(ob&&ob.closest('#plan')){
    var kind=ob.dataset.obj, oid=ob.dataset.id, p=svgPt(e), o=planObj({kind:kind,id:oid});
    if(!o||!p)return;
    var pos=kind==='loose'?locOf(o):{x:o.x,y:o.y};
    S.sel={t:kind,id:oid};
    var label=kind==='tower'?'Башня '+o.tag:(kind==='furn'?furnI(o):lib(o.libId)).name;
    $$('#plan .obj.sel').forEach(function(n){n.classList.remove('sel')});ob.classList.add('sel');renderInspector();
    startDrag(e,{src:'plan',kind:kind,id:oid,dx:pos.x-p.x,dy:pos.y-p.y,label:label});
  }
});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='unit'){S.units=el.dataset.u;persist();renderLib();render()}
  else if(a==='tab'){S.tab=el.dataset.tab;S.sel=null;S.pmode='obj';S.drawPts=[];$('#main').innerHTML='';render()}
  else if(a==='undo')undo();
  else if(a==='wb'){S.wbOpen=!S.wbOpen;renderWarn()}
  else if(a==='view'){S.view[S.tab]=el.dataset.v;S.pmode='obj';S.drawPts=[];$('#main').innerHTML='';render()}
  else if(a==='drawer'){if(el.dataset.d==='lib')S.libOpen=!S.libOpen;else S.sideOpen=!S.sideOpen;render()}
  else if(a==='reset'){snap();var d=sample();S.towers=d.towers;S.loose=d.loose;S.furn=d.furn;S.custom=[];S.runs=d.runs;S.sel=null;persist();renderLib();render();toast('Пример восстановлен. Можно отменить')}
  else if(a==='kind'){S.kind=el.dataset.k;renderLib()}
  else if(a==='add')addFromLib(el.dataset.id);
  else if(a==='custom')openCustom();
  else if(a==='close-modal'){if(e.target===el)$('#modal').innerHTML=''}
  else if(a==='close-modal-btn')$('#modal').innerHTML='';
  else if(a==='rm-tower'){var tid=el.dataset.id;mutate(function(){S.towers=S.towers.filter(function(t){return t.id!==tid});S.sel=null})}
  else if(a==='rm-case'){var t=S.towers.filter(function(x){return x.id===el.dataset.t})[0],cid=el.dataset.c;mutate(function(){t.cases=t.cases.filter(function(c){return c.id!==cid});if(!t.cases.length)S.towers=S.towers.filter(function(x){return x!==t});S.sel=null})}
  else if(a==='rm-sel')removeSel();
  else if(a==='rot')rotateSel();
  else if(a==='smove'){var sf2=S.sel&&findRitem(S.sel.id);if(sf2){var j=sf2.k+(el.dataset.d==='up'?1:-1);if(j>=0&&j<sf2.c.items.length)mutate(function(){var tmp=sf2.c.items[sf2.k];sf2.c.items[sf2.k]=sf2.c.items[j];sf2.c.items[j]=tmp})}}
  else if(a==='sel'){S.sel={t:el.dataset.t,id:el.dataset.id};if(el.dataset.tower){S.sel.tower=el.dataset.tower;S.sel.cas=el.dataset.cas}renderMain();renderInspector();renderSide()}
  else if(a==='warn'){var w=CALC.warns[+el.dataset.i];if(w&&w.sel){S.sel=w.sel;renderMain();renderInspector();renderSide()}}
  else if(a==='lmode'){
    var L=S.loose.filter(function(l){return l.id===S.sel.id})[0],m=el.dataset.m;if(!L||L.mode===m)return;
    mutate(function(){
      if(m==='box'){L.mode='box';delete L.run;delete L.s;delete L.x;delete L.y}
      else if(m==='run'){var r=RUNS[0];if(!r){toast('Сначала нарисуйте трассу на плане');return}L.mode='run';L.run=L.run||r.id;L.s=runLen(runById(L.run))/2;delete L.x;delete L.y}
      else{var p=L.mode==='run'&&runById(L.run)?pointAt(runById(L.run),L.s):{x:430,y:200};L.mode='free';L.x=p.x;L.y=p.y+30;delete L.run;delete L.s}
    });
  }
  else if(a==='copy')copySpec();
  else if(a==='pmode'){S.pmode=el.dataset.m==='obj'?'obj':'runs';S.drawPts=[];if(S.pmode==='obj'&&S.sel&&S.sel.t==='run')S.sel=null;render()}
  else if(a==='draw-start'){S.pmode='draw';S.drawPts=[];S.sel=null;render()}
  else if(a==='draw-done')finishDraw();
  else if(a==='draw-cancel')cancelDraw();
  else if(a==='selrun'){S.sel={t:'run',id:el.dataset.id};if(S.pmode==='obj')S.pmode='runs';render()}
  else if(a==='run-rev'){var R3=S.sel&&runById(S.sel.id);if(R3){var len3=runLen(R3);mutate(function(){S.loose.forEach(function(l){if(l.mode==='run'&&l.run===R3.id)l.s=len3-l.s});R3.pts.reverse()})}}
  else if(a==='fedit'){if(S.sel&&S.sel.t==='furn')openFurnEditor(S.sel.id)}
  else if(a==='fpreset')presetFurn();
  else if(a==='libdel'){var lid=el.dataset.id;if(libUsed(lid)){toast('Позиция используется в проекте. Сначала уберите её с плана или из башен')}else{var nm3=lib(lid).name;mutate(function(){S.custom=S.custom.filter(function(x){return x.id!==lid})});renderLib();toast('Удалено из библиотеки: «'+nm3+'»')}}
  else if(a==='guide'){$('#guide').innerHTML=guideHTML()}
  else if(a==='close-guide'){if(e.target===el)$('#guide').innerHTML=''}
  else if(a==='close-guide-btn')$('#guide').innerHTML='';
  else if(a==='gto'){var tg2=document.getElementById('g-'+el.dataset.id);if(tg2)tg2.scrollIntoView({behavior:'smooth',block:'start'})}
});
document.addEventListener('dblclick',function(e){var c=e.target.closest('.card');if(c&&!e.target.closest('.add'))addFromLib(c.dataset.lib)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.deckon!=null){var Fd=S.sel&&S.furn.filter(function(x){return x.id===S.sel.id})[0];if(Fd)mutate(function(){if(t.value){var spd=findDeckOnSpot(furnI(Fd),Fd);Fd.x=spd.x;Fd.y=spd.y;if(spd.on)Fd.on=true}else delete Fd.on});return}
  if(t.dataset.lay!=null){var Tl=S.sel&&S.towers.filter(function(x){return x.id===S.sel.id})[0];if(Tl)mutate(function(){if(t.value)Tl.lay=t.value;else delete Tl.lay});return}
  if(t.dataset.drawtype!=null){S.drawType=t.value;renderPlanTools();renderPlan();return}
  if(t.dataset.runname!=null){var Rn=S.sel&&runById(S.sel.id);if(Rn)mutate(function(){Rn.name=t.value.trim()||Rn.name});return}
  if(t.dataset.runtype!=null){var Rt=S.sel&&runById(S.sel.id),TT=rtype(t.value);if(Rt)mutate(function(){Rt.k=TT.k;Rt.cv=TT.cv;Rt.short=TT.short});return}
  if(t.dataset.addcaseBottom!=null&&t.value){var tb=S.towers.filter(function(x){return x.id===t.dataset.addcaseBottom})[0],cb=t.value;mutate(function(){tb.cases.unshift(cb==='__stack'?{id:uid(),stack:true,items:[]}:{id:uid(),caseId:cb,items:[]})});return}
  if(t.dataset.addcase!=null&&t.value){var tw=S.towers.filter(function(x){return x.id===t.dataset.addcase})[0],cid=t.value;mutate(function(){tw.cases.push(cid==='__stack'?{id:uid(),stack:true,items:[]}:{id:uid(),caseId:cid,items:[]})});return}
  if(t.dataset.rename){var tw2=S.towers.filter(function(x){return x.id===t.dataset.rename})[0];if(tw2){snap();tw2.name=t.value.trim()||('Башня '+tw2.tag);persist();render()}return}
  if(t.dataset.lrun!=null){var L=S.loose.filter(function(l){return l.id===S.sel.id})[0];if(L)mutate(function(){L.run=t.value;L.s=runLen(runById(t.value))/2})}
  if(t.id==='cf-kind')syncCustom();
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;renderLib()}});
document.addEventListener('submit',function(e){if(e.target.id==='cform'){e.preventDefault();saveCustom()}else if(e.target.id==='fform'){e.preventDefault();applyFurn()}});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea'){if(e.key==='Escape')$('#modal').innerHTML='';return}
  if(S.pmode==='draw'){
    if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();S.drawPts.pop();renderPlan();renderPlanTools();return}
    if(e.key==='Enter'){finishDraw();return}
    if(e.key==='Escape'){cancelDraw();return}
  }
  if(e.key==='Delete'||e.key==='Backspace'){if(S.sel){e.preventDefault();removeSel()}}
  else if((e.key==='r'||e.key==='к'||e.key==='R')&&S.sel&&(S.sel.t==='tower'||S.sel.t==='furn'))rotateSel();
  else if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='я')){e.preventDefault();undo()}
  else if(e.key==='Escape'){$('#modal').innerHTML='';$('#guide').innerHTML='';S.sel=null;render()}
});

document.addEventListener('contextmenu',function(e){
  var ob=e.target.closest('#plan [data-obj="furn"]');
  if(!ob||S.pmode!=='obj')return;
  e.preventDefault();S.sel={t:'furn',id:ob.dataset.id};renderPlan();renderInspector();openFurnEditor(ob.dataset.id);
});
document.addEventListener('dblclick',function(e){
  var vt=e.target.closest('[data-vtx]');
  if(vt&&S.pmode==='runs'){var R=S.sel&&runById(S.sel.id);if(R&&R.pts.length>2){var i=+vt.dataset.vtx;mutate(function(){R.pts.splice(i,1)})}else toast('В трассе должно остаться минимум две точки');return}
  if(S.pmode==='draw'&&e.target.closest('#plan'))finishDraw();
});
document.addEventListener('pointermove',function(e){
  if(S.pmode!=='draw'||drag)return;
  if(!(e.target.closest&&e.target.closest('#plan')))return;
  var p=svgPt(e);if(!p)return;S.drawHover=snapRunPt(p);renderPlan();
});
document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.dataset&&d.dataset.key)S.open[d.dataset.key]=d.open},true);
renderLib();render();
})();
</script>

</body>
</html>
