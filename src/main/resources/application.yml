server:
  port: 8080

spring:
  application:
    name: led-scheme

  datasource:
    url: jdbc:h2:file:./data/led-scheme;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.vjstb.ledscheme: INFO
