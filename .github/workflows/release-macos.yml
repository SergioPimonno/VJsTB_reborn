name: Release macOS build

# Собирает нативный .dmg для macOS (с встроенным Java-рантаймом — пользователю
# не нужно ставить Java отдельно) и прикладывает его к существующему GitHub
# Release с указанным тегом. jpackage умеет собирать только под ту ОС, на
# которой запущен, поэтому mac-сборка обязательно идёт на macos-latest раннере,
# а не локально (разработка ведётся на Windows).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, к которому прикладывать .dmg (например v1.3)'
        required: true
        default: 'v1.3'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Определить тег
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # jpackage --app-version на macOS (в отличие от .deb на Linux) требует
          # СТРОГО 1-3 целых числа через точку — экспериментальные теги вида
          # "2.4exp" валит сборку ("Version [2.4exp] contains invalid component
          # [4exp]"). Отрезаем первый нечисловой/неточечный символ и всё после
          # него — тег/имя файла релиза (см. шаги ниже) при этом остаются
          # оригинальными, трогаем только то, что реально идёт в jpackage.
          APP_VERSION=$(echo "$VERSION" | sed -E 's/[^0-9.].*$//')
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="0.0.1"
          fi
          echo "appversion=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SSH-агент для ledscheme-model (приватный репозиторий)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LEDSCHEME_MODEL_DEPLOY_KEY }}

      - name: Собрать и установить ledscheme-model в локальный m2
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          git clone --depth 1 git@github.com:SergioPimonno/ledscheme-model.git /tmp/ledscheme-model
          cd /tmp/ledscheme-model
          mvn -q -DskipTests install

      - name: Собрать jar
        run: mvn -q -DskipTests package

      - name: Подготовить вход для jpackage
        run: |
          mkdir -p dist-input
          cp target/led-scheme.jar dist-input/led-scheme.jar

      - name: Собрать .dmg (jpackage, со встроенным рантаймом)
        run: |
          jpackage \
            --type dmg \
            --input dist-input \
            --dest dist \
            --name "AVE_ToolBox" \
            --main-jar led-scheme.jar \
            --main-class com.vjstb.ledscheme.App \
            --app-version "${{ steps.ver.outputs.appversion }}" \
            --vendor "AVE_ToolBox" \
            --mac-package-name "AVE_ToolBox" \
            --icon packaging/icon-main.icns

      - name: Загрузить .dmg в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find dist -name '*.dmg' | head -n1)
          mv "$DMG" "dist/AVE_ToolBox-${{ steps.ver.outputs.tag }}-mac.dmg"
          gh release upload "${{ steps.ver.outputs.tag }}" \
            "dist/AVE_ToolBox-${{ steps.ver.outputs.tag }}-mac.dmg" \
            --repo "${{ github.repository }}" \
            --clobber
